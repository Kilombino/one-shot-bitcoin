# One password in front of every dashboard. Written by ./oneshot; edits are
# overwritten on the next install or update.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

auth_basic "One Shot Bitcoin";
auth_basic_user_file /etc/nginx/htpasswd;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 600s;
client_max_body_size 64m;

# Docker's resolver, so a dashboard that is still starting does not stop nginx.
resolver 127.0.0.11 valid=10s;

server {
    listen 8000;
    root /srv/panel;
    add_header Cache-Control "no-store";
}
server {
    listen 8001;
    location / { set $up http://@NET_PREFIX@.10:3000; proxy_pass $up; }
}
server {
    listen 8002;
    location / { set $up http://@NET_PREFIX@.21:3006; proxy_pass $up; }
}
server {
    listen 8003;
    # DATUM's dashboard asks for its own admin password when you change settings.
    location / { set $up http://@NET_PREFIX@.30:7152; proxy_pass $up; proxy_set_header Authorization ""; }
}
